{% if session.get("player_id") == room.host_id %}

<div class="game-settings">

    <h2>Game Settings</h2>

    <p
        id="minimum-players-message"
        {% if room.players|length >= 4 %}hidden{% endif %}
    >
        You need at least 4 players to start the game.
    </p>

    <form
        id="game-settings-form"
        method="POST"
        action="{{ url_for('rooms.start_game') }}"
        {% if room.players|length < 4 %}hidden{% endif %}
    >

        <label for="mafia_count">Mafia:</label>

        <select id="mafia_count" name="mafia_count">

            {% set max_mafia = (room.players|length - 1) // 2 %}

            {% for count in range(1, max_mafia + 1) %}
                <option value="{{ count }}">
                    {{ count }}
                </option>
            {% endfor %}

        </select>


        <label for="game_mode">Game Mode:</label>

        <select id="game_mode" name="game_mode">

            <option value="elimination">
                Elimination Mode
            </option>

            <option value="one_shot">
                One-Shot Mode
            </option>

        </select>


        <button type="submit">
            Start Game
        </button>

    </form>

</div>

{% else %}

<div class="waiting-message">

    <p>Waiting for the host to start the game...</p>

</div>

{% endif %}
