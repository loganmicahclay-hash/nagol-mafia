{% extends "base.html" %}

{% block body %}

<div class="join-room-page">

    <h1>Join Room</h1>

    <form method="POST">

        <label for="room_code">Room Code</label>

        <input
            type="text"
            id="room_code"
            name="room_code"
            placeholder="1234"
            maxlength="4"
            inputmode="numeric"
            required
        >

        <button type="submit">Join Room</button>

    </form>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

</div>

{% endblock %}
