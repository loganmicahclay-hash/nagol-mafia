{% extends "base.html" %}

{% block body %}

<div class="room-page">

    <h1>Lobby</h1>

    <h2>Room Code: {{ room.room_code }}</h2>

    <div id="player-list" hx-get="{{ url_for('rooms.player_list') }}" hx-trigger="every 2s" hx-swap="innerHTML">

        {% include "partials/player_list.html" %}

    </div>


    <div id="game-settings"
         hx-get="{{ url_for('rooms.game_settings') }}" 
         hx-trigger="every 2s" 
         hx-swap="innerHTML"
    >

        {% include "partials/game_settings.html" %}

    </div>


    <a href="{{ url_for('rooms.exit_room') }}">
        <button type="button">Exit Room</button>
    </a>

</div>

<script>
    setInterval(function() {
        fetch("{{ url_for('rooms.heartbeat') }}", {
            method: "POST"
        });
    }, 5000);
</script>

{% endblock %}
