{% extends "base.html" %}

{% block body %}

<div class="room-page">

    <h1>Lobby</h1>

    <h2>{{ room.room_code }}</h2>

    <h3>Players</h3>

    {% for player in room.players %}

    {% if player.id == room.host_id %}
      <p>{{ player.username }} 👑</p>
    {% else %}
      <p>{{ player.username }}</p>
    {% endif %}

    {% endfor %}

    <a href="{{ url_for('rooms.exit_room') }}">
        <button type="button">Exit Room</button>
    </a>

</div>

{% endblock %}
